<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#081520">
  <meta name="description" content="888 Basketball — a precision timing arcade game">
  <title>888 Basketball — Precision Arcade</title>
  <link rel="stylesheet" href="styles/main.css?v=arc-shot-1">
</head>
<body>
  <div id="device-stage">
    <div id="device-shell">
      <canvas id="game-canvas" aria-label="888 Basketball game"></canvas>
      <section id="menu-screen" class="game-screen menu-screen">
        <div class="menu-brand"><span>888</span><small>BASKETBALL</small></div>
        <div class="menu-best"><small id="your-best-label">YOUR BEST</small><strong id="menu-best-score">000</strong></div>
        <div class="menu-actions">
          <button id="start-button" class="menu-button menu-button--primary">START</button>
          <button id="leaderboard-button" class="menu-button">LEADERBOARD</button>
          <button id="settings-button" class="menu-button">SETTINGS</button>
        </div>
      </section>
      <section id="modes-screen" class="game-screen modes-screen is-hidden">
        <div class="modes-card">
          <p id="modes-kicker" class="modes-kicker">CHOOSE YOUR RUN</p>
          <h2 id="modes-title">GAME MODES</h2>
          <button id="full-mode-button" class="mode-choice mode-choice--primary"><strong>FULL GAME</strong><small>10 LEVELS · 24 SEC EACH</small></button>
          <button id="endless-mode-button" class="mode-choice"><strong>ENDLESS</strong><small>3 MISSES · GET HARDER EVERY SHOT</small></button>
          <button id="arc-mode-button" class="mode-choice mode-choice--arc"><strong>ARC SHOT</strong><small>DRAW THE PERFECT CURVE</small></button>
          <button id="modes-back-button" class="menu-button">BACK</button>
        </div>
      </section>
      <section id="leaderboard-screen" class="game-screen leaderboard-screen is-hidden">
        <div class="leaderboard-card">
          <div class="leaderboard-head"><h2 id="leaderboard-title">TOP 100</h2><span id="leaderboard-status">LOADING</span></div>
          <ol id="leaderboard-list" class="leaderboard-list"></ol>
          <button id="leaderboard-back-button" class="menu-button">BACK</button>
        </div>
      </section>
      <section id="settings-screen" class="game-screen settings-screen is-hidden">
        <div class="settings-card">
          <h2 id="settings-title">SETTINGS</h2>
          <div class="setting-row"><span id="sound-label">SOUND</span><button id="sound-toggle" class="setting-toggle">ON</button></div>
          <div class="setting-row setting-row--language"><span id="language-label">LANGUAGE</span><div><button class="lang-button" data-lang="en">EN</button><button class="lang-button" data-lang="ru">RU</button></div></div>
          <button id="back-button" class="menu-button">BACK</button>
          <p id="app-version" class="app-version">VERSION 1.0.6+6</p>
        </div>
      </section>
    </div>
  </div>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="src/main.js?v=arc-shot-1"></script>
</body>
</html>
